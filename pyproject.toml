[build-system]
requires = ["setuptools>=77", "torch>=2.13,<2.14"]
build-backend = "setuptools.build_meta"

[project]
name = "nabladyn"
version = "0.1.0"
description = "GPU molecular dynamics and differentiable, trainable potentials in PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Xinxin Deng"}]
requires-python = ">=3.12"
dependencies = ["numpy", "torch>=2.13,<2.14"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
samples = ["h5py>=3.16"]  # HDF5 sample files
examples = ["h5py>=3.16", "matplotlib>=3.11"]  # sample files and figures

[tool.setuptools.packages.find]
where = ["src"]
